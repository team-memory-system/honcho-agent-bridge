<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>팀 메모리</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b5412a'/%3E%3Ctext x='16' y='22' font-size='17' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E기%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script>
    try { const theme = localStorage.getItem("tm.theme"); if (theme) document.documentElement.dataset.theme = theme; } catch {}
  </script>
</head>
<body>
  <div class="shell">
    <aside class="rail" id="rail">
      <div class="mark"><span class="seal">기</span><strong>팀 메모리</strong></div>
      <nav class="nav" id="nav" aria-label="메뉴"></nav>
      <div>
        <div class="nav-label">이 컴퓨터</div>
        <div class="machine" id="machine"></div>
      </div>
      <div class="rail-foot">
        <div class="who"><b id="who-name">—</b><small id="who-space">—</small></div>
        <button class="btn quiet icon-only small" id="theme" type="button" title="화면 밝기"></button>
      </div>
    </aside>
    <div class="main">
      <div class="mobile-bar">
        <button class="btn icon-only small" id="menu" type="button" aria-label="메뉴">☰</button>
        <span class="seal">기</span><strong>팀 메모리</strong>
      </div>
      <main id="page" class="view" tabindex="-1"></main>
    </div>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <!-- The two forms that write this computer's setup. They are plain markup so the
       fields the server accepts can be checked against what the page sends. -->
  <template id="tpl-setup-form">
    <form id="setup-form" class="form-grid" autocomplete="off">
      <label class="field">
        <span>기억 속의 내 이름</span>
        <input class="input" name="userPeer" required pattern="[A-Za-z0-9_\-]+" placeholder="예: user_minji">
        <small>영문·숫자·밑줄. 내 모든 컴퓨터에서 같은 이름을 씁니다.</small>
      </label>
      <label class="field">
        <span>작업공간</span>
        <input class="input" name="workspace" pattern="[A-Za-z0-9_\-]+" placeholder="memory">
        <small>보통 그대로 둡니다.</small>
      </label>
      <label class="field wide">
        <span>기억 서버 주소</span>
        <input class="input" name="honchoUrl" type="url" placeholder="이 컴퓨터의 서버를 쓰면 비워 둡니다">
        <small>내 다른 컴퓨터에 서버가 있으면 그 주소를 넣습니다.</small>
      </label>
      <label class="field wide">
        <span>서버 토큰</span>
        <input class="input" name="apiToken" type="password" placeholder="다른 컴퓨터의 서버로 보낼 때">
        <small>서버를 둔 컴퓨터의 앱에서 서버 → 다른 컴퓨터에서 쓰기 → 서버 토큰 복사로 받습니다.</small>
      </label>
      <details class="field wide access-fields">
        <summary>Cloudflare WARP를 켤 수 없는 컴퓨터라면</summary>
        <p class="muted">보통은 이 컴퓨터에서 Cloudflare WARP를 팀 계정으로 켜 두면 됩니다. WARP를 켤 수 없으면 서버 관리자에게 Access 서비스 토큰을 받아 넣습니다.</p>
        <div class="form-grid">
          <label class="field">
            <span>Access 서비스 토큰 ID</span>
            <input class="input" name="accessClientId" type="password" autocomplete="off">
          </label>
          <label class="field">
            <span>Access 서비스 토큰 비밀</span>
            <input class="input" name="accessClientSecret" type="password" autocomplete="off">
          </label>
        </div>
      </details>
      <div class="field wide">
        <span>대화를 모을 에이전트</span>
        <div class="checks">
          <label><input type="checkbox" name="agents" value="claude" checked> Claude Code</label>
          <label><input type="checkbox" name="agents" value="codex" checked> Codex</label>
        </div>
      </div>
    </form>
  </template>

  <template id="tpl-bridge-form">
    <form id="bridge-form" class="form-grid" autocomplete="off">
      <label class="field wide">
        <span>공유 창구 주소</span>
        <input class="input" name="url" type="url" required placeholder="https://…">
      </label>
      <label class="field wide">
        <span>창구 토큰</span>
        <input class="input" name="token" type="password" required>
      </label>
      <label class="field">
        <span>Cloudflare 서비스 토큰 ID</span>
        <input class="input" name="accessClientId" type="password">
      </label>
      <label class="field">
        <span>Cloudflare 서비스 토큰 비밀</span>
        <input class="input" name="accessClientSecret" type="password">
      </label>
    </form>
  </template>

  <script type="module" src="/app.js"></script>
</body>
</html>
