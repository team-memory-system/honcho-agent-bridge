name: honcho-agent-bridge

x-honcho-service: &honcho-service
  image: honcho-agent-bridge-server:${HONCHO_IMAGE_TAG:-local}
  build:
    context: ./honcho
    dockerfile: Dockerfile
  env_file:
    - path: ${HONCHO_ENV_FILE:-.env}
      required: false
  environment: &honcho-environment
    DB_CONNECTION_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
    CACHE_URL: redis://redis:6379/0?suppress=true
    CACHE_ENABLED: "true"
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *honcho-service
    entrypoint: ["sh", "docker/entrypoint.sh"]
    ports:
      - "127.0.0.1:${HONCHO_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

  deriver:
    <<: *honcho-service
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    # The api's entrypoint runs the migrations; started beside it, the deriver
    # found no vector columns and exited once before its restart.
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  database:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./honcho/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  dashboard:
    image: honcho-agent-bridge-dashboard:${HONCHO_IMAGE_TAG:-local}
    build:
      context: ./honcho/local-dashboard
      dockerfile: Dockerfile
    environment:
      HONCHO_URL: http://api:8000
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "4173"
      MCP_CONTROL_MODE: file
      MCP_CONTROL_ALLOW_REMOTE: "1"
      HONCHO_MCP_TOOL_CONFIG: /honcho-agent-bridge-data/mcp-tools.json
      # The Team Memory app is the screen; this container keeps only the /api routes
      # the app relays (tool switches, audit log) and sends a browser to the app.
      DASHBOARD_APP_URL: "http://127.0.0.1:${HONCHO_AGENT_BRIDGE_UI_PORT:-4180}/"
      # 조회 기록: the audit log is read from the mcp service's /audit, with the team
      # MCP token that service checks. mcp runs only while the server is shared, so
      # otherwise the read fails (502) and the app says sharing is off; nothing here
      # waits for it.
      HONCHO_MCP_AUDIT_URL: http://mcp:8765/audit
      HONCHO_MCP_BEARER_TOKEN: ${HONCHO_TEAM_MCP_TOKEN:-}
    ports:
      - "127.0.0.1:${HONCHO_DASHBOARD_PORT:-4173}:4173"
    volumes:
      - ../data:/honcho-agent-bridge-data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Sharing this server (`server share enable`). Only runs with COMPOSE_PROFILES=share
  # in the private .env. The tunnel reaches this service and nothing else, and
  # Cloudflare Access covers the whole host, so every caller from outside is a person
  # with a verified Access login. What each may do is in ../runtime/gate (/gate-state):
  # access.json, which the owner's app writes (owners, teammates who chat, teammates
  # who collect), and devices.json, the computers registered here, which only the
  # gate writes. /team-memory/* tells a person what they may do and registers a
  # computer. /health and /v3/* go to the API: with the gate token as before (the
  # health check below holds it), from an owner's registered computer as sent, and
  # from a collecting teammate's only their own conversations. /mcp goes to the mcp
  # service for an owner or a teammate allowed to chat, with the projects they may
  # ask in the scope headers; until the Access team domain, audience and team MCP
  # token are set, /mcp is not found.
  gate:
    image: honcho-agent-bridge-dashboard:${HONCHO_IMAGE_TAG:-local}
    command: ["node", "/gate/gate.mjs"]
    profiles: ["share"]
    environment:
      HONCHO_GATE_TOKEN: ${HONCHO_GATE_TOKEN:-}
      HONCHO_GATE_MCP_UPSTREAM: http://mcp:8765
      HONCHO_GATE_ACCESS_TEAM_DOMAIN: ${HONCHO_ACCESS_TEAM_DOMAIN:-}
      HONCHO_GATE_ACCESS_AUD: ${HONCHO_ACCESS_AUD:-}
      HONCHO_TEAM_MCP_TOKEN: ${HONCHO_TEAM_MCP_TOKEN:-}
      HONCHO_GATE_STATE_DIR: /gate-state
    ports:
      - "127.0.0.1:${HONCHO_GATE_PORT:-8010}:8010"
    volumes:
      - ./gate:/gate:ro
      - ../runtime/gate:/gate-state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health',{headers:{authorization:'Bearer '+process.env.HONCHO_GATE_TOKEN}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Teammates asking this server's memory over MCP. Reached only through the gate's
  # /mcp, which has already verified the caller's Cloudflare Access login, found
  # them in access.json, and sends the team MCP token, the verified email and the
  # scope headers: x-honcho-scope-mode `all` for an owner, `projects` with
  # x-honcho-allowed-scopes for a teammate. The gate drops any x-honcho-* header a
  # caller sent, so with HONCHO_MCP_SCOPE_FROM_GATE the bridge trusts these, and a
  # teammate's `chat` answers only from the projects opened to them. It answers
  # `chat` alone, over one workspace as one peer; callers cannot point it at another
  # by header or argument. Its /audit, the record of those calls, and /guard-trial,
  # where the owner tries a question as a teammate's, are for the dashboard only:
  # neither is under /mcp, so the gate never passes them on.
  mcp:
    image: honcho-agent-bridge-mcp:${HONCHO_IMAGE_TAG:-local}
    build:
      context: ./honcho/local-mcp-bridge
      dockerfile: Dockerfile
    profiles: ["share"]
    environment:
      HONCHO_BASE_URL: http://api:8000
      HONCHO_MCP_HOST: 0.0.0.0
      HONCHO_MCP_PORT: "8765"
      HONCHO_MCP_PATH: /mcp
      HONCHO_MCP_REQUIRE_AUTH: "1"
      HONCHO_MCP_BEARER_TOKEN: ${HONCHO_TEAM_MCP_TOKEN:-}
      HONCHO_MCP_ENABLED_TOOLS: chat
      HONCHO_MCP_PIN_DEFAULTS: "1"
      HONCHO_WORKSPACE_ID: ${HONCHO_TEAM_WORKSPACE:-memory}
      HONCHO_USER_NAME: ${HONCHO_TEAM_PEER:-}
      # Every call is recorded, with the caller's email, in a schema of its own here.
      HONCHO_AUDIT_DSN: postgresql://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
      HONCHO_AUDIT_BRIDGE: team
      HONCHO_AUDIT_READ: "1"
      HONCHO_MCP_SCOPE_FROM_GATE: "1"
      # Jev judges each teammate's `chat` question first and refuses one about the
      # owner's private life rather than shared work, then judges the answer and
      # withholds one that gives such things away. Off while HONCHO_JEV_GATE is
      # empty. In a team the bridge asks the team hub's guard instead
      # (HONCHO_JEV_GUARD_URL): the Jev key stays in the hub, and this server holds
      # only its own token for the guard, which the hub can revoke; the app writes
      # both and HONCHO_JEV_GATE=1 into the private .env. Outside a team the bridge
      # uses TYPESAFE_API_KEY directly, also only in the private .env; with a guard
      # address set it does not.
      HONCHO_JEV_GATE: ${HONCHO_JEV_GATE:-}
      HONCHO_JEV_GUARD_URL: ${HONCHO_JEV_GUARD_URL:-}
      HONCHO_JEV_GUARD_TOKEN: ${HONCHO_JEV_GUARD_TOKEN:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-}
      HONCHO_JEV_MODEL: ${HONCHO_JEV_MODEL:-}
      HONCHO_JEV_THRESHOLD: ${HONCHO_JEV_THRESHOLD:-0.7}
      HONCHO_JEV_FAIL_MODE: ${HONCHO_JEV_FAIL_MODE:-open}
      HONCHO_JEV_ANSWER_FAIL_MODE: ${HONCHO_JEV_ANSWER_FAIL_MODE:-closed}
      HONCHO_JEV_TOOLS: ${HONCHO_JEV_TOOLS:-chat}
    # The bridge has no health route; any HTTP answer (401 without the token) means
    # it is serving.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as r, urllib.error as e\ntry: r.urlopen('http://127.0.0.1:8765/mcp', timeout=2)\nexcept e.HTTPError: pass"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # The Cloudflare Tunnel of this server, remotely managed: its public hostname and
  # ingress (http://gate:8010) are set in Cloudflare, so only the token is here.
  tunnel:
    image: cloudflare/cloudflared:2026.8.3
    command: ["tunnel", "--no-autoupdate", "run"]
    profiles: ["share"]
    environment:
      TUNNEL_TOKEN: ${HONCHO_TUNNEL_TOKEN:-}
    depends_on:
      - gate
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
