name: honcho-agent-bridge

x-honcho-service: &honcho-service
  image: honcho-agent-bridge-server:${HONCHO_IMAGE_TAG:-local}
  build:
    context: ./honcho
    dockerfile: Dockerfile
  env_file:
    - path: ${HONCHO_ENV_FILE:-.env}
      required: false
  environment: &honcho-environment
    DB_CONNECTION_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
    CACHE_URL: redis://redis:6379/0?suppress=true
    CACHE_ENABLED: "true"
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *honcho-service
    entrypoint: ["sh", "docker/entrypoint.sh"]
    ports:
      - "127.0.0.1:${HONCHO_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

  deriver:
    <<: *honcho-service
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    # The api's entrypoint runs the migrations; started beside it, the deriver
    # found no vector columns and exited once before its restart.
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  database:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./honcho/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  dashboard:
    image: honcho-agent-bridge-dashboard:${HONCHO_IMAGE_TAG:-local}
    build:
      context: ./honcho/local-dashboard
      dockerfile: Dockerfile
    environment:
      HONCHO_URL: http://api:8000
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "4173"
      MCP_CONTROL_MODE: file
      MCP_CONTROL_ALLOW_REMOTE: "1"
      HONCHO_MCP_TOOL_CONFIG: /honcho-agent-bridge-data/mcp-tools.json
    ports:
      - "127.0.0.1:${HONCHO_DASHBOARD_PORT:-4173}:4173"
    volumes:
      - ../data:/honcho-agent-bridge-data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Sharing this server with the owner's other computers (`server share enable`).
  # Only runs with COMPOSE_PROFILES=share in the private .env. The Cloudflare
  # tunnel on this machine reaches this port and nothing else; every request needs
  # the gate token, and only /health and /v3/* reach the API.
  gate:
    image: honcho-agent-bridge-dashboard:${HONCHO_IMAGE_TAG:-local}
    command: ["node", "/gate/gate.mjs"]
    profiles: ["share"]
    environment:
      HONCHO_GATE_TOKEN: ${HONCHO_GATE_TOKEN:-}
    ports:
      - "127.0.0.1:${HONCHO_GATE_PORT:-8010}:8010"
    volumes:
      - ./gate:/gate:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8010/health',{headers:{authorization:'Bearer '+process.env.HONCHO_GATE_TOKEN}}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
