name: agent-memory

x-honcho-service: &honcho-service
  image: agent-memory-honcho:${HONCHO_IMAGE_TAG:-local}
  build:
    context: ./honcho
    dockerfile: Dockerfile
  env_file:
    - path: ${HONCHO_ENV_FILE:-.env}
      required: false
  environment: &honcho-environment
    DB_CONNECTION_URI: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@database:5432/postgres
    CACHE_URL: redis://redis:6379/0?suppress=true
    CACHE_ENABLED: "true"
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    database:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  api:
    <<: *honcho-service
    entrypoint: ["sh", "docker/entrypoint.sh"]
    ports:
      - "127.0.0.1:${HONCHO_API_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)\""]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 15s

  deriver:
    <<: *honcho-service
    entrypoint: ["/app/.venv/bin/python", "-m", "src.deriver"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import os; os.kill(1, 0)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  database:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    command: ["postgres", "-c", "max_connections=200"]
    volumes:
      - ./honcho/database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.2
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  dashboard:
    image: agent-memory-dashboard:${HONCHO_IMAGE_TAG:-local}
    build:
      context: ./honcho/local-dashboard
      dockerfile: Dockerfile
    environment:
      HONCHO_URL: http://api:8000
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: "4173"
      MCP_CONTROL_MODE: file
      MCP_CONTROL_ALLOW_REMOTE: "1"
      HONCHO_MCP_TOOL_CONFIG: /agent-memory-data/mcp-tools.json
    ports:
      - "127.0.0.1:${HONCHO_DASHBOARD_PORT:-4173}:4173"
    volumes:
      - ../data:/agent-memory-data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
